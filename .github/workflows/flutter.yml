name: Flutter checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        timeout-minutes: 2
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Select CI checks
        id: scope
        timeout-minutes: 2
        run: node tools/ci_scope.mjs

      - name: Test CI selection and progress tools
        timeout-minutes: 1
        run: node --test tools/ci_scope.test.mjs tools/project_progress.test.mjs

      - name: Check documentation links and metrics
        timeout-minutes: 1
        run: node tools/check_docs.mjs

      - name: Set up Java for Firestore Emulator
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 3
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache npm dependencies
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 2
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-npm-${{ hashFiles('.nvmrc', 'tools/package-lock.json', 'functions/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-npm-

      - name: Cache Firestore and Storage Emulators
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 3
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firestore-storage-v1-${{ hashFiles('tools/package-lock.json') }}

      - name: Set up Flutter
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 3
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 2
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 3
        run: flutter analyze

      - name: Test
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 5
        run: flutter test

      - name: Test browser read-state persistence
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 3
        run: |
          dart test --platform chrome test/read_state_store_browser.dart
          node tools/run_read_sync_transport_tests.mjs

      - name: Install Firestore Rules test dependencies
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 4
        working-directory: tools
        run: npm ci

      - name: Install Cloud Functions dependencies
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 4
        working-directory: functions
        run: npm ci

      - name: Test development tools
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 2
        working-directory: tools
        run: npm run test:tools

      - name: Show test tool versions
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 2
        run: |
          node --version
          npm --version
          npm --prefix tools run firebase -- --version

      - name: Lint Cloud Functions
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 2
        working-directory: functions
        run: npm run lint

      - name: Test Cloud Functions
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 3
        working-directory: functions
        run: npm test

      - name: Test Firestore Rules and server transactions
        if: steps.scope.outputs.full != 'false'
        # 464 tests passed at 4m59s in run 44907302349; allow emulator shutdown too.
        timeout-minutes: 6
        working-directory: tools
        # Debug output is kept in firebase-debug.log for failure diagnostics.
        env:
          DEBUG: 'true'
        run: npm run test:rules

      - name: Test consistent B4 reader
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 3
        working-directory: tools
        run: npm run test:body-reader

      - name: Test B4 card states and resumable backfill
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 4
        working-directory: tools
        run: npm run test:card-state

      - name: Test B4 client transport, state Rules and Chrome against emulator
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 4
        working-directory: tools
        env:
          B4_BROWSER: '1'
        run: npm run test:delta-client

      - name: Test B4 controlled transition
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 4
        working-directory: tools
        run: npm run test:card-transition

      - name: Test B4 news count and refresh fence
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 5
        working-directory: tools
        run: npm run test:feed-news

      - name: Test prepared private reply deletion
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 3
        working-directory: tools
        run: npm run test:private-deletion

      - name: Test prepared content report decisions
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 3
        working-directory: tools
        run: npm run test:report-decisions

      - name: Test prepared moderation sanctions
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 4
        working-directory: tools
        run: npm run test:moderation-sanctions

      - name: Test inactive content lifecycle
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 6
        working-directory: tools
        run: npm run test:content-lifecycle

      - name: Test inactive moderation queue and large decisions
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 6
        working-directory: tools
        run: npm run test:moderation-queue

      - name: Test prepared Business review
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 4
        working-directory: tools
        run: npm run test:business-review

      - name: Test prepared B2 runtime
        if: steps.scope.outputs.full != 'false'
        # 10k real emulator uploads take ~6.7 min locally including fixture cleanup.
        timeout-minutes: 10
        working-directory: tools
        run: npm run test:read-runtime

      - name: Test final account retention cleanup
        if: steps.scope.outputs.full != 'false'
        # Keep the bounded retention suite independent of the existing Rules timeout.
        # Each emulator is stopped by emulators:exec before the next step starts.
        timeout-minutes: 4
        working-directory: tools
        run: npm run test:purge

      - name: Test Storage Rules and cross-service identity access
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 4
        working-directory: tools
        run: npm run test:storage

      - name: Build web
        if: steps.scope.outputs.full != 'false'
        timeout-minutes: 5
        run: node tools/web_environment.mjs build dev --debug --archive

      - name: Upload emulator failure logs
        if: ${{ steps.scope.outputs.full != 'false' && (failure() || cancelled()) }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: emulator-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            firebase-debug.log
            firestore-debug.log
            tools/firebase-debug.log
            tools/firestore-debug.log
            storage-debug.log
            tools/storage-debug.log
          if-no-files-found: ignore
          retention-days: 7
