<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0A6371">
  <title>Ověření e-mailu · ShoutOut</title>
  <style>
    :root { color-scheme: light dark; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #eef8f8; color: #1f2933; }
    main { width: min(100%, 430px); padding: 32px 26px; border-radius: 28px;
      background: #fff; border: 1px solid #dcebec; box-shadow: 0 18px 50px #074b5718;
      text-align: center; }
    .mark { width: 64px; height: 64px; margin: 0 auto 18px; display: grid; place-items: center;
      border-radius: 20px; background: linear-gradient(145deg,#1496a8,#074b57); color: white;
      font-size: 34px; }
    h1 { margin: 0 0 12px; font-size: 27px; }
    p { margin: 0; line-height: 1.5; color: #697a84; }
    a, button { display: inline-block; margin-top: 24px; padding: 13px 22px; border: 0; border-radius: 999px;
      background: #87d0db; color: #12363d; font-weight: 700; text-decoration: none; }
    form { margin-top: 22px; text-align: left; }
    label { display: block; margin: 12px 0 6px; font-size: 13px; color: #697a84; }
    input { width: 100%; padding: 13px; border: 1px solid #9eb1b7; border-radius: 13px;
      background: transparent; color: inherit; font: inherit; }
    form button { width: 100%; cursor: pointer; }
    .spinner { width: 28px; height: 28px; margin: 22px auto 0; border: 3px solid #dcebec;
      border-top-color: #0e8ea0; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      body { background: #091519; color: #eef7f8; }
      main { background: #101f24; border-color: #294047; box-shadow: none; }
      p { color: #b9c8cc; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✉</div>
    <h1 id="title">Ověřuji e-mail…</h1>
    <p id="message">Chvilku strpení, kontrolujeme ověřovací odkaz.</p>
    <div id="spinner" class="spinner" aria-label="Načítání"></div>
    <form id="password-form" hidden>
      <label id="password-label" for="password">Nové heslo</label>
      <input id="password" type="password" minlength="8" autocomplete="new-password" required>
      <label id="confirmation-label" for="confirmation">Nové heslo znovu</label>
      <input id="confirmation" type="password" minlength="8" autocomplete="new-password" required>
      <button id="submit-password" type="submit">Uložit nové heslo</button>
    </form>
    <a id="continue" href="/" hidden>Pokračovat do ShoutOutu</a>
  </main>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
    import { applyActionCode, confirmPasswordReset, getAuth, verifyPasswordResetCode } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';

    const text = {
      cs: {
        checking: ['Ověřuji e-mail…', 'Chvilku strpení, kontrolujeme ověřovací odkaz.'],
        success: ['E-mail je ověřený', 'Můžeš se vrátit do ShoutOutu a pokračovat v registraci.'],
        invalid: ['Odkaz nelze použít', 'Odkaz je neplatný, už byl použit nebo vypršela jeho platnost. V aplikaci si můžeš poslat nový.'],
        request: ['Neplatný požadavek', 'Tato stránka neobsahuje platný odkaz pro ověření e-mailu.'],
        reset: ['Nastav nové heslo', 'Zadej nové heslo k účtu.'],
        mismatch: ['Hesla se neshodují', 'Zadej stejné heslo do obou polí.'],
        resetSuccess: ['Heslo bylo změněno', 'Nyní se můžeš přihlásit novým heslem.'],
        recovered: ['E-mail účtu byl obnoven', 'Nechtěná změna e-mailové adresy byla vrácena zpět.'],
        button: 'Pokračovat do ShoutOutu',
        password: 'Nové heslo', confirmation: 'Nové heslo znovu', savePassword: 'Uložit nové heslo',
      },
      en: {
        checking: ['Verifying email…', 'Please wait while we check the verification link.'],
        success: ['Email verified', 'Return to ShoutOut to continue registration.'],
        invalid: ['This link cannot be used', 'The link is invalid, has already been used, or has expired. You can request a new one in the app.'],
        request: ['Invalid request', 'This page does not contain a valid email verification link.'],
        reset: ['Set a new password', 'Enter a new password for your account.'],
        mismatch: ['Passwords do not match', 'Enter the same password in both fields.'],
        resetSuccess: ['Password changed', 'You can now sign in with your new password.'],
        recovered: ['Account email recovered', 'The unwanted email address change has been reverted.'],
        button: 'Continue to ShoutOut',
        password: 'New password', confirmation: 'Repeat new password', savePassword: 'Save new password',
      },
    };
    const params = new URLSearchParams(location.search);
    const language = (params.get('lang') || navigator.language || 'cs').slice(0, 2);
    const copy = text[language] || text.en;
    document.documentElement.lang = language;
    const title = document.querySelector('#title');
    const message = document.querySelector('#message');
    const spinner = document.querySelector('#spinner');
    const button = document.querySelector('#continue');
    const form = document.querySelector('#password-form');
    const password = document.querySelector('#password');
    const confirmation = document.querySelector('#confirmation');
    document.querySelector('#password-label').textContent = copy.password;
    document.querySelector('#confirmation-label').textContent = copy.confirmation;
    document.querySelector('#submit-password').textContent = copy.savePassword;
    button.textContent = copy.button;
    const show = (state) => {
      [title.textContent, message.textContent] = copy[state];
      spinner.hidden = true;
      form.hidden = true;
      button.hidden = false;
    };

    const mode = params.get('mode');
    const code = params.get('oobCode');
    if (!code || !['verifyEmail', 'resetPassword', 'recoverEmail'].includes(mode)) {
      show('request');
    } else {
      const app = initializeApp({
        apiKey: 'AIzaSyAqcieaTn_wC-0tB2Y3gVCtD7dj9lINSJs',
        authDomain: 'shoutout-dev-46c81.firebaseapp.com',
        projectId: 'shoutout-dev-46c81',
        appId: '1:696035472864:web:744f27eac9135ba91ae785',
      });
      const auth = getAuth(app);
      if (mode === 'resetPassword') {
        verifyPasswordResetCode(auth, code).then(() => {
          [title.textContent, message.textContent] = copy.reset;
          spinner.hidden = true;
          form.hidden = false;
          password.focus();
        }).catch(() => show('invalid'));
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (password.value !== confirmation.value) {
            [title.textContent, message.textContent] = copy.mismatch;
            return;
          }
          form.querySelector('button').disabled = true;
          try {
            await confirmPasswordReset(auth, code, password.value);
            show('resetSuccess');
          } catch (_) {
            show('invalid');
          }
        });
      } else {
        applyActionCode(auth, code)
          .then(() => show(mode === 'verifyEmail' ? 'success' : 'recovered'))
          .catch(() => show('invalid'));
      }
    }
  </script>
</body>
</html>
